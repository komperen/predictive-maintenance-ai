name: Build image and Helm chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run offline tests
        run: |
          pip install h2o-wave requests
          python tests/test_offline_harness.py

      - name: Read app version
        id: meta
        run: |
          VERSION=$(grep -E '^Version' app.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/predictive-maintenance-ai
          helm template pm deploy/helm/predictive-maintenance-ai > /dev/null

      - name: Package Helm chart
        run: |
          helm package deploy/helm/predictive-maintenance-ai --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
