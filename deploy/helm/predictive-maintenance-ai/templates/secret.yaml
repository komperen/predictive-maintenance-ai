{{- if not .Values.llm.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pm-ai.secretName" . }}
  labels:
    {{- include "pm-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.llm.telegramBotToken | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.llm.telegramChatId | quote }}
  OPENROUTER_API_KEY: {{ .Values.llm.openrouterApiKey | quote }}
{{- end }}
